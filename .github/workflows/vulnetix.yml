# Managed by `vulnetix gha init`. Edit .vulnetix/workflow.yaml and re-run it.
name: Vulnetix Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    if: github.event_name != 'pull_request' || (startsWith(github.head_ref, 'belai/') && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Vulnetix/cli/secrets@v4.24.6
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          extra-args: |
            --ignore-binaries
            --ignore-git
          artifact-name: secrets
          fail-on-findings: false
          rules: |
            Vulnetix/community-rules
            Vulnetix/opa-fugue-regula
            Vulnetix/opa-checkmarx-kics
            Vulnetix/opa-cds-aws-tf
            Vulnetix/opa-cigna-tf
            Vulnetix/opa-aquasecurity-trivy

  sast-go:
    name: SAST go
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    if: github.event_name != 'pull_request' || (startsWith(github.head_ref, 'belai/') && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Vulnetix/cli/sast/go@v4.24.6
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: sast-go
          fail-on-findings: false
          rules: |
            Vulnetix/community-rules
            Vulnetix/opa-fugue-regula
            Vulnetix/opa-checkmarx-kics
            Vulnetix/opa-cds-aws-tf
            Vulnetix/opa-cigna-tf
            Vulnetix/opa-aquasecurity-trivy
            Vulnetix/opa-gosec
      - uses: Vulnetix/cli/sast@v4.24.6
        if: ${{ !cancelled() }}
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          not-language: go
          artifact-name: sast-go-rest
          fail-on-findings: false
          rules: |
            Vulnetix/community-rules
            Vulnetix/opa-fugue-regula
            Vulnetix/opa-checkmarx-kics
            Vulnetix/opa-cds-aws-tf
            Vulnetix/opa-cigna-tf
            Vulnetix/opa-aquasecurity-trivy

  sca:
    name: SCA
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    if: github.event_name != 'pull_request' || (startsWith(github.head_ref, 'belai/') && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Vulnetix/cli/sca@v4.24.6
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: sca-scan
          fail-on-findings: false

  license:
    name: License
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    if: github.event_name != 'pull_request' || (startsWith(github.head_ref, 'belai/') && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Vulnetix/cli/license@v4.24.6
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: license
          fail-on-findings: false

  cbom:
    name: CBOM
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    if: github.event_name != 'pull_request' || (startsWith(github.head_ref, 'belai/') && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Vulnetix/cli/cbom@v4.24.6
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: cbom
          fail-on-findings: false

  aibom:
    name: AIBOM
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    if: github.event_name != 'pull_request' || (startsWith(github.head_ref, 'belai/') && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Vulnetix/cli/aibom@v4.24.6
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: aibom
          fail-on-findings: false
          extra-args: |
            --commit-scan-max
            1

  analyze:
    name: Analyze
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    if: github.event_name != 'pull_request' || (startsWith(github.head_ref, 'belai/') && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: Vulnetix/cli/analyze@v4.24.6
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: analyze
          fail-on-findings: false

  sbom:
    name: SBOM
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    if: github.event_name != 'pull_request' || (startsWith(github.head_ref, 'belai/') && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Vulnetix/cli/sbom@v4.24.6
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: sca
          fail-on-findings: false

  publish:
    name: Publish
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (startsWith(github.head_ref, 'belai/') && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: [secrets, sast-go, sca, license, cbom, aibom, analyze, sbom]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Vulnetix/cli/gha-upload@v4.24.6
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          fail-on-findings: false

  tea:
    name: TEA
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (startsWith(github.head_ref, 'belai/') && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: [cbom, aibom, sbom]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          pattern: "{sca,cbom,aibom}"
          merge-multiple: true
          path: boms
      - uses: Vulnetix/cli/tea-release@v4.24.6
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          tea-files: "boms/*.cdx.json"
          tea-auto-version: true
          tea-checksums-from-release: true
          fail-on-findings: false
